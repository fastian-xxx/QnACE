version: '3.8'

services:
  qnace-backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app/integrated_system:/app/interview_emotion_detection/src
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped

  qnace-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://qnace-backend:8001
    depends_on:
      - qnace-backend
    restart: unless-stopped